name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-manifests:
    name: Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pyyaml
        run: pip3 install pyyaml
      - name: Validate manifest schemas
        run: bash Scripts/validate-manifests.sh

  build:
    name: Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build

  test:
    name: Test
    runs-on: macos-15
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test

  # Newest Xcode on the newest runner image. GitHub's macos-26 image tops out
  # at Xcode 26.6 today; this picks up Xcode 27 automatically once the image
  # ships it, and warns until then.
  test-latest-xcode:
    name: Test (latest Xcode)
    runs-on: macos-26
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          case "$XCODE" in
            *Xcode_27*) ;;
            *) echo "::warning::No Xcode 27 on this runner image yet; testing with $XCODE" ;;
          esac
      - name: Test
        run: swift test
